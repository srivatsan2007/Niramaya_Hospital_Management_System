services:
  - type: web
    name: niramaya-hospital-system
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NEON_DB_URL
        sync: false
      - key: NEON_DB_USER
        sync: false
      - key: NEON_DB_PASS
        sync: false
